name: crawl

# 10分おきに一次情報サイトを巡回し、結果の data.json だけを Cloudflare R2 に置く。
#
# 【2026-08-14〜16】この間だけ1時間おきに落としていた。
#   秘密情報の流出でリポジトリを非公開にしていたため。Actions が無料で回り放題なのは
#   パブリックリポジトリのときだけで、プライベートだと月2,000分の枠に入る。
#   10分おき＝月4,320回は、1回1分で数えても枠を倍以上こえる。
#   8月16日に履歴を消してパブリックへ戻したので、10分おきに復帰した。
#   次に非公開にするときは、同じ理由でまたここを "0 * * * *" に落とすこと。
#
# なぜ Pages を再デプロイしないのか:
#   Pages 無料プランのビルドは月500回まで。頻繁に再デプロイすると足りません。
#   静的HTMLは変更したときだけデプロイし、時間ごとに変わるデータは R2 から配信します。
#   R2 は書き込み(Class A)が月100万回まで無料、エグレスも無料なので、この使い方なら $0 です。
#
# なぜ Cloudflare Workers の Cron ではないのか:
#   Workers 無料プランは1実行あたり CPU 10ms。16サイト分のXML/JSONパースは確実に超えます
#   （Cloudflare 自身のドキュメントに「大きなペイロードのパースは 10-20ms」と記載）。
#   Workers でやるなら有料 $5/月。GitHub Actions はパブリックリポジトリなら無料です。

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:          # 手動実行
  push:
    branches: [main]
    # site/ を含めているので、サイトを直したら push だけでデプロイまで走ります。
    paths: ["site/**", "crawl.py", ".github/workflows/crawl.yml"]

permissions:
  contents: read

concurrency:
  group: crawl
  cancel-in-progress: false   # 巡回の途中で止めない

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ETag / Last-Modified を実行間で持ち回る。
      # これがないと毎回フル取得になり、気象庁の帯域制限（1日10GBでIP遮断）に近づきます。
      - name: Restore crawler state
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            out
          key: crawl-state-${{ github.run_id }}
          restore-keys: crawl-state-

      # 断水戸数の抽出だけPDF解析が必要。他のソースは標準ライブラリのみで動きます。
      - name: Install PDF parser
        run: pip install --quiet pdfplumber

      - name: Crawl
        timeout-minutes: 8
        run: python3 crawl.py --inject site/index.html --verbose

      - name: Save crawler state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            out
          key: crawl-state-${{ github.run_id }}

      # 壊れた data.json を配ってしまうと、サイト側は generated_at で弾いた末に
      # 「確認中」を出し続ける。上げる前にここで一度だけ形を確かめる。
      - name: Check data.json
        run: |
          test -s out/data.json
          python3 -c "import json,sys; d=json.load(open('out/data.json')); \
            assert d.get('generated_at'), 'generated_at がない'; \
            assert d.get('sources'), 'sources が空'; \
            print('data.json OK', d['generated_at'], len(d['sources']), 'sources')"

      # data.json を R2 に配置。サイト側は data.kumamotojishin.jp/data.json を読みます。
      #
      # 【2026-09-04】ここは以前 npx wrangler r2 object put を使っていて、失敗した。
      #   巡回そのものは165秒で成功していたのに、npx が毎回 wrangler（約20MB）を
      #   取り直す作りで、その取得が固まって timeout-minutes: 4 に当たった。
      #   ログの最後は「Terminate orphan process: pid (2290) (npm exec wrangl)」。
      #   結果、その日の data.json は 08:29 のまま止まった。
      #
      #   wrangler が中でやっているのは、下とまったく同じ1本のリクエストです
      #   （wrangler 4.115.0 の putRemoteObject を読んで確かめました）。
      #     PUT https://api.cloudflare.com/client/v4
      #         /accounts/{account_id}/r2/buckets/{bucket}/objects/{key}
      #     Authorization: Bearer <APIトークン>
      #     cache-control / content-type などをそのままヘッダに載せる
      #   つまり npm は必要ありません。curl は ubuntu-latest に最初から入っています。
      #   トークンも今までと同じものでそのまま通ります（wrangler と同じ経路・同じ権限）。
      - name: Upload data.json to R2
        timeout-minutes: 3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # --max-time で1回あたりを縛る。固まったら殺して次を試す、を3回まで。
          # 前回はこれがなくて、固まったまま4分すぎて落ちた。
          code=$(curl -sS -X PUT \
            --max-time 45 --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/r2.json -w '%{http_code}' \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/kumamotojishin-data/objects/data.json" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json; charset=utf-8" \
            -H "Cache-Control: public, max-age=60, s-maxage=120" \
            --data-binary @out/data.json)
          # 応答本文にはトークンは出ませんが、念のため中身は success の判定にだけ使い、
          # 失敗したときだけ表示します。
          if [ "$code" != "200" ]; then
            echo "R2へのアップロードが HTTP $code で失敗しました"
            cat /tmp/r2.json || true
            exit 1
          fi
          python3 -c "import json; d=json.load(open('/tmp/r2.json')); \
            print('R2 OK') if d.get('success') else (_ for _ in ()).throw(SystemExit('R2が success=false を返しました: '+json.dumps(d.get('errors'), ensure_ascii=False)))"

      # 埋め込み済みHTMLの更新は、Pagesのビルド枠を使い切らないよう手動/push時のみ。
      #
      # 【2026-09-04】!cancelled() を足した理由。
      #   R2へのアップロードが失敗すると、その手前で止まってここまで来ませんでした。
      #   そのせいで、断水の修正を push しても R2 が詰まっているというだけの理由で
      #   サイト本体が7時間ほど古いままになりました（実際に起きました）。
      #   データの配信とサイトの配信は別のものなので、片方が転んでも
      #   もう片方は出す。ジョブ全体の成否は変わりません。
      - name: Deploy site
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # ここは push と手動実行のときだけ走ります。npx の取得が固まる事故が
          # 2026年9月4日に R2 の方で起きたので、こちらも1回はやり直すようにしました。
          # Pages のデプロイは複数ファイルのアップロードで curl では書きにくいため、
          # wrangler のまま残しています。
          for i in 1 2; do
            if timeout 300 npx --yes wrangler@4.115.0 pages deploy site \
                 --project-name kumamotojishin \
                 --commit-dirty=true; then
              exit 0
            fi
            echo "デプロイに失敗しました（$i回目）。30秒待ってやり直します。"
            sleep 30
          done
          exit 1

      # 失敗に気づけないと、更新が止まったまま放置される。
      # GitHubからのメール通知に加えて、サマリの先頭にも明示する。
      - name: Mark failure
        if: failure()
        run: |
          echo "## 巡回に失敗しました" >> $GITHUB_STEP_SUMMARY
          echo "サイトの表示は前回のデータのまま続きます（壊れてはいません）が、" >> $GITHUB_STEP_SUMMARY
          echo "更新が止まっています。ログを確認してください。" >> $GITHUB_STEP_SUMMARY

      - name: Report
        if: always()
        run: |
          echo "### 巡回結果" >> $GITHUB_STEP_SUMMARY
          if [ -f out/data.json ]; then
            python3 - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          d = json.load(open("out/data.json"))
          ng = [s for s in d["sources"] if s["status"] == "取得失敗"]
          print(f"- 生成時刻: {d['generated_at']}")
          print(f"- ソース: {len(d['sources'])}件中 {len(d['sources'])-len(ng)}件成功")
          print(f"- 更新: {len(d['updates'])}件 ／ 地震: {len(d['quakes'])}件")
          for s in ng:
              print(f"  - 失敗: {s['label']}")
          PY
          else
            echo "- data.json が生成されませんでした" >> $GITHUB_STEP_SUMMARY
          fi
